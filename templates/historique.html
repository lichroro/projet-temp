<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historique — {{ armoire.nom }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- Chart.js en local (la Pi peut ne pas avoir Internet) :
       curl -o static/chart.umd.min.js https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js -->
  <script src="{{ url_for('static', filename='chart.umd.min.js') }}"></script>
</head>
<body>
  <header><h1>{{ armoire.nom }} — {{ armoire.type_produit }}</h1><a href="{{ url_for('dashboard') }}">Retour</a></header>
  <main>
    <canvas id="graphique" height="120"></canvas>
    {% if not points %}<p>Aucune mesure sur les 7 derniers jours.</p>{% endif %}
  </main>
  <script>
    // Q36 : courbe + lignes de seuil réglementaire
    const points = {{ points|tojson }};
    const tmin = {{ armoire.temp_min }}, tmax = {{ armoire.temp_max }};
    const labels = points.map(p => p.t.slice(5, 16));
    new Chart(document.getElementById("graphique"), {
      type: "line",
      data: { labels, datasets: [
        { label: "Température (°C)", data: points.map(p => p.y), borderColor: "#0d5c7a", pointRadius: 0, tension: 0.1 },
        { label: "Seuil max", data: labels.map(() => tmax), borderColor: "#c62f2f", borderDash: [6, 4], pointRadius: 0 },
        { label: "Seuil min", data: labels.map(() => tmin), borderColor: "#c62f2f", borderDash: [6, 4], pointRadius: 0 }
      ]},
      options: { animation: false, scales: { x: { ticks: { maxTicksLimit: 14 } } } }
    });
  </script>
</body>
</html>
